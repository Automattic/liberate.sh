<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#ffffff" />
		<title>liberate.sh: take your website anywhere</title>
		<meta
			name="description"
			content="Turn your Wix, Squarespace, Shopify or Webflow site into a WordPress site you own. Download it, then host it anywhere."
		/>
		<link rel="canonical" href="https://liberate.sh/" />
		<meta name="robots" content="index, follow, max-image-preview:large" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="liberate.sh" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://liberate.sh/" />
		<meta property="og:title" content="liberate.sh: take your website anywhere" />
		<meta
			property="og:description"
			content="Leave your website builder with everything: your pages, your images and the look, packed into a WordPress site you own."
		/>
		<meta property="og:image" content="https://liberate.sh/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="2400" />
		<meta property="og:image:height" content="1260" />
		<meta property="og:image:alt" content="Leave Squarespace with everything. liberate.sh" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="liberate.sh: take your website anywhere" />
		<meta
			name="twitter:description"
			content="Leave your website builder with everything: your pages, your images and the look, packed into a WordPress site you own."
		/>
		<meta name="twitter:image" content="https://liberate.sh/og.png" />
		<meta name="twitter:image:alt" content="Leave Squarespace with everything. liberate.sh" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "liberate.sh",
				"url": "https://liberate.sh/",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Any",
				"description": "Turn a website built on a closed platform into a WordPress site you can download and host anywhere.",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"publisher": { "@type": "Organization", "name": "Automattic", "url": "https://automattic.com/" }
			}
		</script>
		<script type="module" src="/src/web/main.ts"></script>
	</head>
	<body>
		<div class="page">
			<header>
				<a class="brand" href="/">liberate<span>.sh</span></a>
			</header>
			<main id="stage" class="stage">
				<h1 class="headline">Leave <span class="x">Wix</span><br />with everything.</h1>
				<noscript><p class="fine">liberate.sh needs JavaScript to run.</p></noscript>
			</main>
			<footer class="foot">
				<p class="makers">
					<a href="https://github.com/Automattic/liberate.sh">Open source</a>, brought to you by the
					makers of<a class="maker" href="https://developer.wordpress.com/studio/" aria-label="WordPress Studio">
						<span class="maker-stack" aria-hidden="true"></span>
					</a>
				</p>
				<p class="hosted">
					Hosted on<a class="host" href="https://spacefast.com" aria-label="Hosted on Spacefast">
						<img src="/makers/spacefast.svg" alt="" width="152" height="29" />
					</a>
				</p>
			</footer>
		</div>
	</body>
</html>
