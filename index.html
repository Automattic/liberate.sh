<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#ffffff" />
		<title>liberate.sh: take your website anywhere</title>
		<meta
			name="description"
			content="Turn your Wix, Squarespace, Shopify or Webflow site into a WordPress site you own. Download it, then host it anywhere."
		/>
		<meta property="og:title" content="liberate.sh" />
		<meta
			property="og:description"
			content="Leave your website builder with everything: pages, posts, images, products and the look."
		/>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script type="module" src="/src/web/main.ts"></script>
	</head>
	<body>
		<div class="page">
			<header>
				<a class="brand" href="/">liberate<span>.sh</span></a>
			</header>
			<main id="stage" class="stage">
				<h1 class="headline">Leave <span class="x">Wix</span><br />with everything.</h1>
				<noscript><p class="fine">liberate.sh needs JavaScript to run.</p></noscript>
			</main>
			<footer class="foot">
				<p class="makers">
					<a href="https://github.com/Automattic/liberate.sh">Open source</a>, brought to you by the
					makers of<a class="maker" href="https://developer.wordpress.com/studio/" aria-label="WordPress Studio">
						<span class="maker-stack" aria-hidden="true"></span>
					</a>
				</p>
				<p class="hosted">
					Hosted on<a class="host" href="https://spacefast.com" aria-label="Hosted on Spacefast">
						<img src="/makers/spacefast.svg" alt="" width="152" height="29" />
					</a>
				</p>
			</footer>
		</div>
	</body>
</html>
